<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨花下载器</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>梨花下载器</h1><p>把当前网站的登录状态同步到本机下载器。</p><label for="code">配对码</label><div class="pair"><input id="code" placeholder="在下载器中获取配对码" autocomplete="off"><button id="pair">连接</button></div><p class="tip">首次使用时，在下载器中点击“安装扩展”并复制配对码。</p><button id="sync" class="primary">同步当前网站</button><p id="status" role="status">请先打开并登录需要下载的网站。</p></main><script src="popup.js"></script></body></html>
